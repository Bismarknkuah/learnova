name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm --workspace @learnova/shared run build
      - name: Typecheck API
        run: npm --workspace @learnova/backend run typecheck
      - name: Unit tests
        run: npm --workspace @learnova/backend run test
      - name: Agent smoke test
        run: npm --workspace @learnova/backend run demo
      - name: Build web
        run: npm --workspace @learnova/frontend run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t learnova-api:${{ github.sha }} .
      - name: Build Web image
        run: docker build -f frontend/Dockerfile -t learnova-web:${{ github.sha }} .
      # Push to your registry (GHCR/ECR) and deploy here.
