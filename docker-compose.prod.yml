# Production overrides: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  api:
    restart: always
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 512M }
    environment:
      NODE_ENV: production
  web:
    restart: always
    deploy:
      replicas: 2
  mongo:
    ports: []          # don't expose the DB publicly in prod
  redis:
    ports: []
