# Development stack. `docker compose up` brings up infra + API + web.
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  livekit:
    image: livekit/livekit-server:latest
    command: --dev
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env]
    environment:
      MONGO_URI: mongodb://mongo:27017/learnova
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      LIVEKIT_URL: ws://livekit:7880
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }
      livekit: { condition: service_started }

  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]

  livekit:
    image: livekit/livekit-server:latest
    command: --dev
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

volumes:
  mongo_data:
  qdrant_data:
